<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japan Trip</title>
<meta name="theme-color" content="#1d3557">
<script>
  // Theme before first paint: a saved choice wins, otherwise the phone's setting.
  let t; try { t = localStorage.getItem('theme'); } catch {}
  document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
<link rel="preload" href="fonts/kaisei-decol-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="map" aria-label="Trip map"></div>
  <div class="top">
    <div class="daychip" id="daychip"></div>
    <button class="theme" id="theme" type="button"></button>
    <button class="offline" id="offline" type="button" hidden></button>
  </div>
  <section class="sheet" id="sheet" aria-live="polite">
    <header class="head" id="head">
      <button class="grab" id="grab" type="button" aria-label="Expand day details" aria-expanded="false"></button>
      <div class="when" id="when"></div>
    </header>
    <div id="card"></div>
    <nav class="nav">
      <button class="btn" id="prev" type="button"></button>
      <div class="dots" id="dots"></div>
      <button class="btn" id="next" type="button"></button>
    </nav>
  </section>
</div>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="vendor/basemaps.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
