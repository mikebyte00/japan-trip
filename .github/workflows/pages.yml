name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/nifty-bell-1byy5f]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      # A fresh shell cache per deploy, so phones never mix old and new JS modules.
      - run: sed -i "s/'shell-v2'/'shell-${GITHUB_SHA::12}'/" sw.js && grep -q "shell-${GITHUB_SHA::12}" sw.js

      # Map files are built here (not committed): restore them, or extract fresh when the areas change.
      # A failed rebuild still deploys the app (the map shows without street detail) and caches nothing.
      - id: maps
        uses: actions/cache/restore@v4
        with:
          path: |
            tiles/*.pmtiles
            tiles/SOURCE
            vendor/glyphs
            vendor/sprites
            vendor/offline.json
          key: maps-${{ hashFiles('tiles/areas.json', 'tools/make-tiles.sh') }}
      - id: build
        if: steps.maps.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash tools/make-tiles.sh
      - if: steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            tiles/*.pmtiles
            tiles/SOURCE
            vendor/glyphs
            vendor/sprites
            vendor/offline.json
          key: ${{ steps.maps.outputs.cache-primary-key }}
      - if: steps.build.outcome == 'failure'
        run: |
          rm -rf tiles/*.pmtiles vendor/glyphs vendor/sprites vendor/offline.json
          echo "::warning::Map rebuild failed; deploying the app without map files."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
